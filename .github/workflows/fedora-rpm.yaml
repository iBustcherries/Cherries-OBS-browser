name: Experimental Fedora 44 RPM

on:
  push:
    branches: [wayland-osr-docks]
    paths:
      - 'panel/**'
      - 'obs-browser-plugin.cpp'
      - 'cmake/**'
      - 'packaging/**'
      - '.github/workflows/fedora-rpm.yaml'
  pull_request:
    branches: [master]
    paths:
      - 'panel/**'
      - 'obs-browser-plugin.cpp'
      - 'cmake/**'
      - 'packaging/**'
      - '.github/workflows/fedora-rpm.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-26.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          dnf install -y https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
          dnf install -y git gcc-c++ cmake ninja-build rpm-build rsync curl tar xz \
            pkgconf-pkg-config extra-cmake-modules qt6-qtbase-devel qt6-qtsvg-devel \
            ffmpeg-free-devel libcurl-devel jansson-devel libX11-devel \
            libXcomposite-devel libXinerama-devel libXrandr-devel libXfixes-devel \
            libXext-devel libxcb-devel libxkbcommon-devel pipewire-devel \
            wayland-devel mesa-libEGL-devel mesa-libGL-devel pulseaudio-libs-devel \
            alsa-lib-devel libv4l-devel libva-devel libdrm-devel systemd-devel \
            pciutils-devel uthash-devel simde-devel nlohmann-json-devel \
            websocketpp-devel asio-devel libqrcodegencpp-devel mbedtls-devel \
            libuuid-devel zlib-devel python3-devel speexdsp-devel x264-devel libvpl-devel fontconfig-devel freetype-devel nv-codec-headers
      - name: Check out browser changes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: browser-fork
          persist-credentials: false
      - name: Check out pinned OBS integration target
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: obsproject/obs-studio
          ref: cffa83ba552f1ef6a0a05851c3aa07b3811d7e58
          path: obs
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Integrate fork and download verified CEF
        shell: bash
        run: |
          rsync -a --delete --exclude=.git --exclude=.github browser-fork/ obs/plugins/obs-browser/
          mkdir -p obs/.deps/cef
          curl -fL -o obs/.deps/cef.tar.xz https://cdn-fastly.obsproject.com/downloads/cef_binary_7871_linux_x86_64.tar.xz
          echo '8ffc64d06ea74da613eeda7f2aa5d4e98661af6fa3ed8c68724c9a6e4e89ea8e  obs/.deps/cef.tar.xz' | sha256sum -c -
          tar --no-same-owner -xJf obs/.deps/cef.tar.xz -C obs/.deps/cef --strip-components=1
      - name: Configure and build Fedora binaries
        shell: bash
        run: |
          cmake -S obs -B obs/build-fedora -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/opt/cherries-obs \
            -DCMAKE_INSTALL_LIBDIR=lib64 -DENABLE_RELOCATABLE=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_BROWSER=ON -DENABLE_BROWSER_PANELS=ON -DENABLE_WAYLAND=ON \
            -DCEF_ROOT_DIR="$GITHUB_WORKSPACE/obs/.deps/cef" \
            -DENABLE_AJA=OFF -DENABLE_VLC=OFF -DENABLE_WEBRTC=OFF \
            -DENABLE_VST=OFF -DENABLE_SCRIPTING=OFF -DENABLE_NEW_MPEGTS_OUTPUT=OFF
          cmake --build obs/build-fedora --parallel 2
          DESTDIR="$GITHUB_WORKSPACE/stage" cmake --install obs/build-fedora
          cp obs/.deps/cef/LICENSE.txt stage/opt/cherries-obs/CEF-LICENSE.txt
      - name: Build RPM
        shell: bash
        run: |
          rpmbuild -bb browser-fork/packaging/cherries-obs-wayland.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "stage_dir $GITHUB_WORKSPACE/stage"
          rpm -qpl rpmbuild/RPMS/x86_64/*.rpm
          rpm -qpR rpmbuild/RPMS/x86_64/*.rpm
      - name: Verify RPM installation and executable loading
        shell: bash
        run: |
          dnf install -y rpmbuild/RPMS/x86_64/*.rpm
          cherries-obs-wayland --version
      - name: Upload experimental Fedora RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cherries-obs-wayland-fedora44-x86_64
          path: rpmbuild/RPMS/x86_64/*.rpm
          retention-days: 14
